<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
     <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/all.css"/>
      <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>


   

  <body class="bg-[#FCFAF7]">

    <!-- Navbar -->
    <header class="bg-[#F8F4EF] shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <a href="index.html"> <img src="./images/logo.png" class="h-16 md:h-20"  alt="Logo">  </a>

        </div>
    </header>

    <!-- Login -->

    <section class="min-h-[85vh] flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-4xl bg-white rounded-3xl shadow-lg border border-[#EEE5DB] p-8 md:p-12">

            <form id="loginForm" class="space-y-6">

                <div>
                    <label class="block mb-2 text-[#6B4F3A] font-medium">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        class="w-full h-14 rounded-xl border border-[#E7DDD3] bg-[#FCFAF7] px-4 outline-none focus:border-[#B08968] focus:ring-2 focus:ring-[#EADBC8] transition">
                </div>

                <div>
                    <label class="block mb-2 text-[#6B4F3A] font-medium">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        class="w-full h-14 rounded-xl border border-[#E7DDD3] bg-[#FCFAF7] px-4 outline-none focus:border-[#B08968] focus:ring-2 focus:ring-[#EADBC8] transition">
                </div>

                <div class="flex items-center gap-2">

                    <input
                        type="checkbox"
                        id="rememberMe"
                        class="w-4 h-4 accent-[#B08968]">

                    <label for="rememberMe"
                           class="text-[#6B4F3A]">
                        Remember Me
                    </label>

                </div>

                <button
                    type="button"
                    onclick="login()"
                    class="w-full md:w-32 h-12 rounded-xl bg-[#B08968] text-white font-semibold hover:bg-[#9C7458] duration-300">
                    Login
                </button>

                <p class="text-[#6B4F3A] text-center md:text-left">
                    Don't have an account?
                    <a href="register.html"
                       class="font-semibold text-[#B08968] hover:underline">
                        Register
                    </a>
                </p>

            </form>

        </div>

    </section>




  <script src="js/script.js"></script>





</body>
</html>
